[project]
name = "memecoin-telegram-call-bot"
version = "0.1.0"
description = "Solana-only Telegram call analytics with paper and guarded live-trading paths."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "openai>=1.30.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "sqlalchemy>=2.0.30",
  "solders>=0.27.0",
  "streamlit>=1.35.0",
  "telethon>=1.35.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[project.scripts]
memetrading-init-db = "db.session:init_db"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/alerts",
  "src/app",
  "src/dashboard",
  "src/data_sources",
  "src/db",
  "src/events",
  "src/llm",
  "src/live",
  "src/paper",
  "src/scoring",
  "src/signer",
  "src/telegram",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
