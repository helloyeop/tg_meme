<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Memecoin Telegram Call Bot 전체 워크플로우 일러스트레이션</title>
  <desc id="desc">Telegram 메시지가 수집, 분류, 병합, 시장 데이터 조회, 페이퍼 트레이딩, 격리된 라이브 트레이딩, 대시보드로 흐르는 과정을 흰 배경 손그림 스타일로 표현한 그림</desc>
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .ink { fill: none; stroke: #111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
      .thin { fill: none; stroke: #111; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
      .dash { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 9; filter: url(#wobble); }
      .blue { stroke: #1976d2; fill: none; }
      .red { stroke: #d7352a; fill: none; }
      .orange { stroke: #f08a24; fill: none; }
      .fill-blue { fill: #eaf4ff; stroke: #111; stroke-width: 3.2; filter: url(#wobble); }
      .fill-red { fill: #fff0ec; stroke: #111; stroke-width: 3.2; filter: url(#wobble); }
      .fill-orange { fill: #fff6e6; stroke: #111; stroke-width: 3.2; filter: url(#wobble); }
      .fill-gray { fill: #f8f8f8; stroke: #111; stroke-width: 3.2; filter: url(#wobble); }
      .label { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 25px; font-weight: 800; fill: #111; }
      .note { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 21px; font-weight: 800; fill: #d7352a; }
      .note-blue { fill: #1976d2; }
      .note-orange { fill: #f08a24; }
      .small { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .tiny { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #333; }
      .xbody { fill: #111; stroke: #111; stroke-width: 2; filter: url(#wobble); }
      .eye { fill: #fff; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text x="72" y="72" class="label">텔레그램 콜 분석 → 안전한 거래 실험실</text>
  <text x="72" y="106" class="tiny">Solana CA만 추출하고, 모든 메시지는 LLM이 읽고, 실거래는 격리된 signer 뒤에 둔다</text>

  <path class="thin red" d="M70 126 C300 116, 520 130, 735 118"/>
  <text x="760" y="126" class="note">DRY RUN 기본값</text>
  <text x="927" y="126" class="note note-blue">Paper 먼저</text>
  <text x="1065" y="126" class="note note-orange">Live는 잠금 뒤</text>

